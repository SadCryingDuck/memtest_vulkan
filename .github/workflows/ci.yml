name: ci

# Checks and builds every push and pull request; the release workflow reuses it for tags.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      version-label:
        description: Version part of the file names, like v0.10.0-duck
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: lint and test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all --all-targets --locked -- -D warnings
      - run: cargo test --all --locked

  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          # Linux builds link against glibc 2.17 with zig, so they run on distributions back to 2014
          - name: linux-x86_64
            os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
            zig-target: x86_64-unknown-linux-gnu.2.17
          - name: linux-aarch64
            os: ubuntu-26.04
            target: aarch64-unknown-linux-gnu
            zig-target: aarch64-unknown-linux-gnu.2.17
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # zig from PyPI, which cargo-zigbuild runs through the given Python
      - if: matrix.zig-target
        name: Install zig
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install --quiet ziglang==0.14.1
          echo "CARGO_ZIGBUILD_PYTHON_PATH=$RUNNER_TEMP/zig/bin/python3" >> "$GITHUB_ENV"
      - if: matrix.zig-target
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Build
        shell: bash
        run: |
          if [ -n "${{ matrix.zig-target }}" ]; then
            cargo zigbuild --release --locked --target "${{ matrix.zig-target }}"
          else
            cargo build --release --locked --target "${{ matrix.target }}"
          fi
      - name: Package
        shell: bash
        env:
          VERSION_LABEL: ${{ inputs.version-label }}
        run: |
          label="${VERSION_LABEL:-git-$(git rev-parse --short HEAD)}"
          name="memtest_vulkan-${label}-${{ matrix.name }}"
          dir="target/${{ matrix.target }}/release"
          mkdir -p dist
          if [ "$RUNNER_OS" = Windows ]; then
            cp "$dir/memtest_vulkan.exe" "dist/$name.exe"
          else
            tar -cJf "dist/$name.tar.xz" -C "$dir" memtest_vulkan
          fi
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
