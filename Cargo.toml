[package]
edition = '2024'
name = 'memtest_vulkan'
# releases are tagged v<version>; the -duck suffix marks this fork's builds
version = '0.13.0-duck'
rust-version = "1.89"
description = 'GPU video memory (VRAM) tester using Vulkan compute shaders'
license = 'GPL-3.0-or-later'
repository = 'https://github.com/SadCryingDuck/memtest_vulkan'
readme = 'Readme.md'

[dependencies]
crossterm = { version = '0.29.0', default-features = false, features = ['events', 'windows'] }
# only formats the log timestamps: no time zone or clock support needed
chrono = { version = '0.4.45', default-features = false, features = ['std'] }

[features]
verbose = []

[target.'cfg(windows)'.dependencies.windows-sys]
default-features = false
features = ['Win32_System_Console', 'Win32_Foundation', 'Win32_System_Diagnostics_ToolHelp', 'Win32_System_Performance', 'Win32_System_SystemInformation', 'Win32_System_Threading', 'Win32_UI_WindowsAndMessaging']
version = '0.61.2'

[target.'cfg(unix)'.dependencies.nix]
default-features = false
features = ['signal']
version = '0.31.3'


# Vulkan bindings. Default features: "loaded" loads the system's Vulkan loader library at
# runtime, "debug" formats Vulkan structures in the verbose output
[dependencies.ash]
version = '0.38.0'

[dependencies.memtest_vulkan_build]
path = './memtest_vulkan_build'

[workspace]
members = ['memtest_vulkan_build']

# produce small file size release builds
[profile.release]
codegen-units = 1
lto = true
strip = true
